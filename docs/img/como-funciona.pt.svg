    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .s1l{stroke:#3987e5} .s2l{stroke:#d95926}
    .main{fill:#1d2a3a;stroke:#3987e5} .child{fill:#232321;stroke:#5a5954} .cont{fill:#3a2519;stroke:#d95926}
    .owner{fill:#2a2a27;stroke:#9a998f} .file{fill:#262624;stroke:#6b6a64} .arrow{fill:#9a998f}
  }
  text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<rect width="960" height="530" class="bg"/><text x="32" y="44" class="t1" font-size="22" font-weight="600">Como o orquestrador funciona</text><rect x="380" y="70" width="200" height="58" rx="10" class="owner" stroke-width="1.5"/><text x="480" y="96" class="t1" font-size="15" text-anchor="middle" font-weight="600">Você (dono)</text><text x="480" y="116" class="t2" font-size="12" text-anchor="middle">decide PR, merge, deploy</text><rect x="360" y="178" width="240" height="62" rx="10" class="main" stroke-width="1.5"/><text x="480" y="205" class="t1" font-size="15" text-anchor="middle" font-weight="600">Sessão principal</text><text x="480" y="226" class="t2" font-size="12" text-anchor="middle">divide, confere, cita suas palavras</text><line x1="470" y1="128" x2="470" y2="176" class="ln" stroke-width="1.5" /><polygon points="470,176 466.8846532615308,168.6315120479769 473.1153467384692,168.6315120479769" class="arrow"/><line x1="490" y1="178" x2="490" y2="130" class="ln" stroke-width="1.5" /><polygon points="490,130 493.1153467384692,137.3684879520231 486.8846532615308,137.3684879520231" class="arrow"/><text x="462" y="156" class="t3" font-size="11" text-anchor="end">ok citado</text><text x="498" y="156" class="t3" font-size="11" >uma pergunta por vez</text><rect x="690" y="182" width="220" height="54" rx="6" class="file" stroke-width="1.5"/><text x="800" y="205" class="t1" font-size="14" text-anchor="middle" font-weight="600">Estado do lote</text><text x="800" y="224" class="t2" font-size="11" text-anchor="middle">frentes · PRs · SHAs · métricas</text><line x1="600" y1="209" x2="690" y2="209" class="ln" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="60" y="310" width="200" height="58" rx="10" class="child" stroke-width="1.5"/><text x="160" y="335" class="t1" font-size="14" text-anchor="middle" font-weight="600">Filha A</text><text x="160" y="355" class="t2" font-size="11" text-anchor="middle">worktree + branch própria</text><line x1="440" y1="240" x2="150" y2="308" class="ln" stroke-width="1.5" /><polygon points="150,308 156.46270335667234,303.28476243189635 157.88511317863149,309.35092196672207" class="arrow"/><rect x="300" y="310" width="200" height="58" rx="10" class="child" stroke-width="1.5"/><text x="400" y="335" class="t1" font-size="14" text-anchor="middle" font-weight="600">Filha B</text><text x="400" y="355" class="t2" font-size="11" text-anchor="middle">worktree + branch própria</text><line x1="470" y1="240" x2="390" y2="308" class="ln" stroke-width="1.5" /><polygon points="390,308 393.5966912898639,300.8541052508858 397.63199007630266,305.6015155878726" class="arrow"/><rect x="540" y="310" width="200" height="58" rx="10" class="child" stroke-width="1.5"/><text x="640" y="335" class="t1" font-size="14" text-anchor="middle" font-weight="600">Filha C</text><text x="640" y="355" class="t2" font-size="11" text-anchor="middle">worktree + branch própria</text><line x1="500" y1="240" x2="630" y2="308" class="ln" stroke-width="1.5" /><polygon points="630,308 622.0268404865157,307.3452272359559 624.9147515027024,301.8242208814812" class="arrow"/><line x1="660" y1="308" x2="592" y2="242" class="ln" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="592,242 599.4572469755541,244.89645775829524 595.1177223861812,249.36748309280074" class="arrow"/><text x="250" y="278" class="t3" font-size="11" >brief</text><text x="648" y="272" class="t3" font-size="11" >resumo ≤ 8 linhas</text><rect x="780" y="310" width="150" height="58" rx="10" class="cont" stroke-width="1.5"/><text x="855" y="335" class="t1" font-size="14" text-anchor="middle" font-weight="600">Filha (cont.)</text><text x="855" y="355" class="t2" font-size="10.5" text-anchor="middle">recebe o bastão em ~200k</text><line x1="740" y1="339" x2="778" y2="339" class="ln" stroke-width="1.5" stroke-dasharray="4 3"/><polygon points="778,339 770.6315120479769,342.1153467384692 770.6315120479769,335.8846532615308" class="arrow"/><rect x="32" y="420" width="176" height="40" rx="8" class="card" stroke-width="1.5"/><text x="120" y="445" class="t1" font-size="12.5" text-anchor="middle">commit local + relatório</text><line x1="210" y1="440" x2="234" y2="440" class="ln" stroke-width="1.5" /><polygon points="234,440 226.6315120479769,443.1153467384692 226.6315120479769,436.8846532615308" class="arrow"/><rect x="236" y="420" width="150" height="40" rx="8" class="card" stroke-width="1.5"/><text x="311" y="445" class="t1" font-size="12.5" text-anchor="middle">conferido no git</text><line x1="388" y1="440" x2="412" y2="440" class="ln" stroke-width="1.5" /><polygon points="412,440 404.6315120479769,443.1153467384692 404.6315120479769,436.8846532615308" class="arrow"/><rect x="414" y="420" width="140" height="40" rx="8" class="card" stroke-width="1.5"/><text x="484" y="445" class="t1" font-size="12.5" text-anchor="middle">PR (seu ok)</text><line x1="556" y1="440" x2="580" y2="440" class="ln" stroke-width="1.5" /><polygon points="580,440 572.6315120479769,443.1153467384692 572.6315120479769,436.8846532615308" class="arrow"/><rect x="582" y="420" width="230" height="40" rx="8" class="main" stroke-width="1.5"/><text x="697" y="445" class="t1" font-size="12.5" text-anchor="middle">merge com CI verde, por SHA</text><line x1="814" y1="440" x2="838" y2="440" class="ln" stroke-width="1.5" /><polygon points="838,440 830.6315120479769,443.1153467384692 830.6315120479769,436.8846532615308" class="arrow"/><rect x="840" y="420" width="110" height="40" rx="8" class="card" stroke-width="1.5"/><text x="895" y="445" class="t1" font-size="12.5" text-anchor="middle">arquivar</text><text x="32" y="505" class="t2" font-size="12.5" >quadro em toda rodada: frente · estado · espera o quê, de quem  +  linha de métricas</text></svg>
