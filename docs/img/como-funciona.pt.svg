<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-label="Como o orquestrador funciona">
<title>Como o orquestrador funciona</title><style>
  .bg{fill:#fcfcfb} .card{fill:#ffffff;stroke:#d9d8d3} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7974}
  .ln{stroke:#b8b7b1} .grid{stroke:#ecebe7} .ax{stroke:#a3a29c}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .s1l{stroke:#2a78d6} .s2l{stroke:#eb6834}
  .main{fill:#eaf2fc;stroke:#2a78d6} .child{fill:#ffffff;stroke:#b8b7b1} .cont{fill:#fdf0ea;stroke:#eb6834}
  .owner{fill:#f3f2ef;stroke:#7a7974} .file{fill:#f6f6f3;stroke:#a3a29c}
  .arrow{fill:#7a7974}
  @media (prefers-color-scheme: dark){
