<rect width="960" height="520" class="bg"/><text x="32" y="44" class="t1" font-size="22" font-weight="600">In real use</text><text x="32" y="68" class="t2" font-size="13" >Three back-to-back batches on a real project (back end + front end)</text><line x1="90" y1="330" x2="900" y2="330" class="ax" stroke-width="1" /><text x="80" y="334" class="t3" font-size="11" text-anchor="end">0</text><line x1="90" y1="256.6666666666667" x2="900" y2="256.6666666666667" class="grid" stroke-width="1" /><text x="80" y="260.6666666666667" class="t3" font-size="11" text-anchor="end">4</text><line x1="90" y1="183.33333333333334" x2="900" y2="183.33333333333334" class="grid" stroke-width="1" /><text x="80" y="187.33333333333334" class="t3" font-size="11" text-anchor="end">8</text><line x1="90" y1="110" x2="900" y2="110" class="grid" stroke-width="1" /><text x="80" y="114" class="t3" font-size="11" text-anchor="end">12</text><path d="M157,330 V150.66666666666666 q0,-4 4,-4 H197 q4,0 4,4 V330 Z" class="s1"/><text x="179" y="140.66666666666666" class="t1" font-size="12" text-anchor="middle" font-weight="600">10</text><path d="M203,330 V260.6666666666667 q0,-4 4,-4 H243 q4,0 4,4 V330 Z" class="s2"/><text x="225" y="250.66666666666669" class="t1" font-size="12" text-anchor="middle" font-weight="600">4</text><path d="M249,330 V297.3333333333333 q0,-4 4,-4 H289 q4,0 4,4 V330 Z" class="s3"/><text x="271" y="287.3333333333333" class="t1" font-size="12" text-anchor="middle" font-weight="600">2</text><text x="225" y="352" class="t2" font-size="12.5" text-anchor="middle">Batch 1</text><path d="M427,330 V132.33333333333334 q0,-4 4,-4 H467 q4,0 4,4 V330 Z" class="s1"/><text x="449" y="122.33333333333334" class="t1" font-size="12" text-anchor="middle" font-weight="600">11</text><path d="M473,330 V315.6666666666667 q0,-4 4,-4 H513 q4,0 4,4 V330 Z" class="s2"/><text x="495" y="305.6666666666667" class="t1" font-size="12" text-anchor="middle" font-weight="600">1</text><path d="M519,330 V205.66666666666666 q0,-4 4,-4 H559 q4,0 4,4 V330 Z" class="s3"/><text x="541" y="195.66666666666666" class="t1" font-size="12" text-anchor="middle" font-weight="600">7</text><text x="495" y="352" class="t2" font-size="12.5" text-anchor="middle">Batch 2</text><path d="M697,330 V242.33333333333331 q0,-4 4,-4 H737 q4,0 4,4 V330 Z" class="s1"/><text x="719" y="232.33333333333331" class="t1" font-size="12" text-anchor="middle" font-weight="600">5</text><path d="M743,330 V279 q0,-4 4,-4 H783 q4,0 4,4 V330 Z" class="s2"/><text x="765" y="269" class="t1" font-size="12" text-anchor="middle" font-weight="600">3</text><text x="811" y="324" class="t1" font-size="12" text-anchor="middle" font-weight="600">0</text><text x="765" y="352" class="t2" font-size="12.5" text-anchor="middle">Batch 3 (in progress)</text><rect x="560" y="82" width="12" height="12" rx="3" class="s1"/><text x="578" y="92" class="t2" font-size="12" >fronts</text><rect x="670" y="82" width="12" height="12" rx="3" class="s2"/><text x="688" y="92" class="t2" font-size="12" >batons</text><rect x="780" y="82" width="12" height="12" rx="3" class="s3"/><text x="798" y="92" class="t2" font-size="12" >deploys</text><text x="32" y="384" class="t2" font-size="12.5" >no baton lost or duplicated work · every deploy only on the owner's explicit request</text><rect x="32" y="404" width="896" height="92" rx="8" class="card" stroke-width="1.5"/><text x="48" y="428" class="t1" font-size="13" font-weight="600">Metrics line (example)</text><text x="48" y="452" class="t1" font-size="11.5" font-family="ui-monospace,Consolas,monospace">metrics · fronts 8 (sessions 6 · reused 2 · subagents 3 · batons 1) · PRs merged 5 · main peak ~180k · estimated savings ~425k</text><text x="48" y="478" class="t2" font-size="12" >estimated savings = floor avoided (reused + subagents) × 85k  +  baton (handoff − successor start) × steps</text></svg>
